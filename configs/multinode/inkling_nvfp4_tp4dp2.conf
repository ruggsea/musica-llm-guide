# Inkling-NVFP4 -- 975B/41B MoE, 256 experts, 592 GB NVFP4 (Marlin W4A16 on Hopper)
# Shape: TP=4 inside each node x DP=2 (one rank per node) x EP=8, Ray-free DP rendezvous.
#  - TP=8 across nodes never works on H100+IB: the fused sconv allreduce is a FlashInfer Lamport
#    allreduce that needs MNNVL fabric (GB200 NVL72) -> hangs (the old inkling_nvfp4.conf, cancelled 135708).
#  - PP was removed for Inkling upstream (recipes#658) -> NotImplementedError.
#  - DP=8/TP=1 replicates the 67.8 GB backbone per GPU -> OOM.
# Memory: experts 513.69/8 + backbone 67.80/4 = 81.2 GB/GPU of 94 -> needs util 0.97.
# No --kernel-config.moe_backend=marlin: on nightly 0.26.1rc1.dev1212 it also applies to layers 0-1, whose MLPs are
# excluded from NVFP4 (hf_quant_config exclude_modules), and fails "moe_backend=marlin is not supported for unquantized MoE"
# (Linz 135861). Auto-selection skips the Blackwell-only NVFP4 kernels and lands on MARLIN on Hopper.
MODEL_ID="thinkingmachines/Inkling-NVFP4"
SERVED_NAME="inkling-nvfp4"
MODE="dpep"
NODES=2
TP=4
DP_SIZE=2
DP_LOCAL=1
DTYPE="auto"
MAX_MODEL_LEN=8192
MAX_NUM_SEQS=8
MAX_NUM_BATCHED_TOKENS=8192
GPU_MEMORY_UTIL=0.97
EXTRA_ARGS="--tensor-parallel-size 4 --enforce-eager --tokenizer-mode inkling --trust-remote-code --limit-mm-per-prompt.image 0 --limit-mm-per-prompt.audio 0"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=false
VENV=$MUSICA_ROOT/venvs/vllm-nightly
WAIT_CHECKS=720
