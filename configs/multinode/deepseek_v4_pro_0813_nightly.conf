# ONE CHANGE vs deepseek_v4_pro_0813.conf: vLLM nightly (0.26.1rc1) instead of 0.25.1. TP4xPP4 (1772725) and TP16 (1773254) both
# failed sanity with identical gibberish on 0.25.1, so pipeline split is ruled out; this tests the vLLM version.
# DeepSeek-V4-Pro-0813 -- 1.6T/49B MoE, 892.8 GB checkpoint (FP4 experts -> Marlin W4A16 on Hopper)
# 4N TP=4 x PP=4: TP inside a node (NVLink), one pipeline stage per node, so the ~29 GB dense backbone
# is split 4 ways instead of replicated per rank (the DP16 OOM, job 1542746). Expected ~54 GB weights/GPU.
# NOT sgl-project/DeepSeek-V4-Pro-FP8 (1606.5 GB > 4-node VRAM). Pre-download with jobs/download_model.slurm.
MODEL_ID="deepseek-ai/DeepSeek-V4-Pro-0813"
SERVED_NAME="deepseek-v4-pro-0813"
MODE="pp"
NODES=4
TP=4
PP=4
DTYPE="auto"
MAX_MODEL_LEN=8192
MAX_NUM_SEQS=8
MAX_NUM_BATCHED_TOKENS=8192
GPU_MEMORY_UTIL=0.92
EXTRA_ARGS="--kv-cache-dtype fp8 --block-size 256 --tokenizer-mode deepseek_v4 --trust-remote-code"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=true
VENV=$MUSICA_ROOT/venvs/vllm-nightly
