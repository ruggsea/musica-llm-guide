# Nemotron-3-Ultra-550B-A55B FP8-dynamic (RedHatAI community; no official FP8)
# nemotron_h hybrid Mamba latent-MoE, 512 experts. vLLM>=0.22. TP=8 across 2 nodes (Ray) + EP.
# 2N is tight (~633GB weights / 8 GPUs); fallback 3N. PP>1 on hybrid mamba risks bad output (#46407).
MODEL_ID="RedHatAI/NVIDIA-Nemotron-3-Ultra-550B-A55B-FP8-dynamic"
SERVED_NAME="nemotron3-ultra-fp8"
MODE="pp"
NODES=3
TP=4
PP=3
DTYPE="auto"
MAX_MODEL_LEN=16384
MAX_NUM_SEQS=8
MAX_NUM_BATCHED_TOKENS=16384
GPU_MEMORY_UTIL=0.90
EXTRA_ARGS="--enforce-eager --enable-expert-parallel --kv-cache-dtype fp8 --mamba-ssm-cache-dtype float16"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=false
VENV=/data/fs201045/rl41113/vllm-025-venv
GUIDE_HF_HOME=/data/fs201045/rl41113/hf-cache-guide
