# Kimi K2.5 — 12-node DP+EP, 32k context for 50-shot ICL judging
# Bumps v8 (8-node 28k) to fit 50-shot prompts which measured at:
#   max 27.3k tokens (gpt-5.2 target) + 256 response = 27.6k
# Need MAX_MODEL_LEN > 28672 — chose 32k for safe margin.
#
# Per-GPU memory (48 GPUs, DP_SIZE=48):
#   Non-expert (TP=4 sharded): 290B / 4 × 0.5 byte = ~36 GB
#   Expert (EP=48 sharded):    768B / 48 × 0.5 byte = ~8 GB
#   Total weights: ~44 GB
#   At 0.93 util on 94 GB GPU: 87 GB budget → 43 GB free
#   32k KV × 1 seq @ ~130 KB/token = ~4 GB
#   profile_run dummy 4096 batched tokens: ~3-4 GB
#   → 35 GB headroom (plenty)
VENV=/data/fs201045/rl41113/vllm-017-venv
MODEL_ID="moonshotai/Kimi-K2.5"
SERVED_NAME="kimi-k25"
MODE="dpep"
NODES=12
TP=4
DP_SIZE=48
DP_LOCAL=4
DTYPE="auto"
MAX_MODEL_LEN=32768
MAX_NUM_SEQS=1
MAX_NUM_BATCHED_TOKENS=4096
GPU_MEMORY_UTIL=0.93
EXTRA_ARGS="--trust-remote-code --enforce-eager"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=false
EXTRA_ENV_EXPORTS="export PYTORCH_ALLOC_CONF=expandable_segments:True"
