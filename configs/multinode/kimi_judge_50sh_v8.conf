# Kimi K2.5 — 8-node DP+EP, 28k context for 50-shot ICL judging
# Uses vllm-017-venv (flashinfer 0.6.4 with PATCHED jit/core.py + pre-compiled .so)
# to avoid the FlashInfer JIT rope-kernel cospi/noexcept conflict that breaks
# vllm-020-venv on the EESSI 2025.06 compute nodes.
#
# Memory tuning for Kimi K2.5 1058B INT4 on 32 GPUs:
#   - Weights + non-expert replicas + activations baseline: ~80 GB/GPU
#   - Profile_run dummy at 4096 batched tokens: ~3 GB more
#   - 28k KV @ MAX_NUM_SEQS=1: ~3.5 GB
#   - PYTORCH_ALLOC_CONF=expandable_segments:True defrags between phases
#   - --enforce-eager skips torch.compile cudagraphs (saves ~5 GB)
#
# 50-shot prompt ≈ 27k tokens (measured), fits in 28k context.
VENV=$MUSICA_ROOT/venvs/vllm-0.17
MODEL_ID="moonshotai/Kimi-K2.5"
SERVED_NAME="kimi-k25"
MODE="dpep"
NODES=8
TP=4
DP_SIZE=32
DP_LOCAL=4
DTYPE="auto"
MAX_MODEL_LEN=28672
MAX_NUM_SEQS=1
MAX_NUM_BATCHED_TOKENS=4096
GPU_MEMORY_UTIL=0.93
EXTRA_ARGS="--trust-remote-code --enforce-eager"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=false
EXTRA_ENV_EXPORTS="export PYTORCH_ALLOC_CONF=expandable_segments:True"
