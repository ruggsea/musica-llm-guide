# Variant of deepseek_v4_pro_0813.conf with the ONLY change: no pipeline split (TP=16 across 4 nodes, PP=1).
# Why: 1772932 (TP4xPP4) failed sanity_check 3/4. fp8 KV cannot be the variable (vLLM asserts fp8_ds_mla needs fp8 KV, 1772981).
# Slow over InfiniBand; this is a correctness test, not a serving config.
# --disable-custom-all-reduce: TP across nodes must use plain NCCL (the node-local custom allreduce / Lamport path needs NVLink or MNNVL; see Inkling). Does not change the maths.
# DeepSeek-V4-Pro-0813 -- 1.6T/49B MoE, 892.8 GB checkpoint (FP4 experts -> Marlin W4A16 on Hopper)
# 4N TP=4 x PP=4: TP inside a node (NVLink), one pipeline stage per node, so the ~29 GB dense backbone
# is split 4 ways instead of replicated per rank (the DP16 OOM, job 1542746). Expected ~54 GB weights/GPU.
# NOT sgl-project/DeepSeek-V4-Pro-FP8 (1606.5 GB > 4-node VRAM). Pre-download with jobs/download_model.slurm.
MODEL_ID="deepseek-ai/DeepSeek-V4-Pro-0813"
SERVED_NAME="deepseek-v4-pro-0813-tp16"
MODE="pp"
NODES=4
TP=16
PP=1
DTYPE="auto"
MAX_MODEL_LEN=8192
MAX_NUM_SEQS=8
MAX_NUM_BATCHED_TOKENS=8192
GPU_MEMORY_UTIL=0.92
EXTRA_ARGS="--disable-custom-all-reduce --kv-cache-dtype fp8 --block-size 256 --tokenizer-mode deepseek_v4 --trust-remote-code"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=true
VENV=$MUSICA_ROOT/venvs/vllm-0.25.1
