# DeepSeek-V4-Pro-0813 batched-speed run + ccscan format check, on the 0.25.1 + --enforce-eager setup that passed sanity (1776506).
# Differs from deepseek_v4_pro_0813_eager.conf only in serving limits for real pages (ccscan prompts are 2,956-11,240 tokens)
# and the POST_PASS_CMD below; the model/numerics flags are unchanged.
source "$(dirname "${BASH_SOURCE[0]}")/deepseek_v4_pro_0813_eager.conf"
SERVED_NAME="deepseek-v4-pro-0813"; MAX_MODEL_LEN=16384; MAX_NUM_SEQS=64
R=/scratch/fs201276/rl41113/ccscan-review
# 1) 5 replies, 30 tokens each, thinking off, for ccscan to read. 2) pilot200_s0 (433 prompts), 1 token, concurrency 64 = the batched number.
POST_PASS_CMD='cd $HOME/musica-llm-guide && export REVIEW_TEMPLATE_KWARGS="{\"thinking\": false, \"enable_thinking\": false}" &&
REVIEW_LIMIT=5 REVIEW_MAX_TOKENS=30 python3 scripts/review_client.py $BASE_URL $SERVED_NAME '$R'/in/pilot200_s0.jsonl '$R'/out/pilot200_s0.deepseek-v4-pro.sample30.jsonl 5;
REVIEW_LABELS=AGENT,HUMAN python3 scripts/review_client.py $BASE_URL $SERVED_NAME '$R'/in/pilot200_s0.jsonl '$R'/out/pilot200_s0.deepseek-v4-pro.jsonl 64'
