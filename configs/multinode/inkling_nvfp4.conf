# Inkling-NVFP4 (Thinking Machines) -- 975B/41B MoE (256 exp, top-6 + 2 shared), Apache 2.0
# 592GB NVFP4 (routed experts 4-bit, W4A16 on Hopper). Hybrid 11 global + 55 SWA(512) layers.
# NEEDS vllm nightly >= f61163e (PR #48858 Hopper fix, Jul 16). tokenizer-mode inkling MANDATORY.
MODEL_ID="thinkingmachines/Inkling-NVFP4"
SERVED_NAME="inkling-nvfp4"
MODE="pp"
NODES=2
TP=8
PP=1
DTYPE="auto"
MAX_MODEL_LEN=16384
MAX_NUM_SEQS=8
MAX_NUM_BATCHED_TOKENS=16384
GPU_MEMORY_UTIL=0.90
EXTRA_ARGS="--kernel-config.moe_backend=marlin --enforce-eager --tokenizer-mode inkling --trust-remote-code --limit-mm-per-prompt.image 0 --limit-mm-per-prompt.audio 0"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=false
VENV=/data/fs201045/rl41113/vllm-nightly-venv
GUIDE_HF_HOME=/data/fs201045/rl41113/hf-cache-guide
WAIT_CHECKS=720
export VLLM_ENABLE_V1_MULTIPROCESSING=0
