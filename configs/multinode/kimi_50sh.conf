# Kimi K2.5 — 4-node DP+EP, extended context for 50-shot ICL
# MAX_MODEL_LEN 24576 (24k) fits 50-shot English prompts comfortably
# MAX_NUM_SEQS 1 keeps marlin MoE working memory under 5 GiB → fits
# vLLM 0.17 + enforce-eager (the verified-working config from the heal loop)
VENV=$MUSICA_ROOT/venvs/vllm-0.17
MODEL_ID="moonshotai/Kimi-K2.5"
SERVED_NAME="kimi-k25"
MODE="dpep"
NODES=4
TP=4
DP_SIZE=16
DP_LOCAL=4
DTYPE="auto"
MAX_MODEL_LEN=24576
MAX_NUM_SEQS=1
MAX_NUM_BATCHED_TOKENS=24576
GPU_MEMORY_UTIL=0.85
EXTRA_ARGS="--trust-remote-code --enforce-eager"
TRUST_REMOTE_CODE=true
NEEDS_DEEPGEMM=false
